<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    # This image installs only production Composer dependencies.
    SetEnv APP_ENV prod
    SetEnv APP_DEBUG 0
    <Directory /var/www/app/public>
        Require all granted
        Options -Indexes
        FallbackResource /index.php
        CGIPassAuth On
    </Directory>
</VirtualHost>
